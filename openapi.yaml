  "components": {
    "schemas": {
      "CPUMetric": {
        "properties": {
          "timestamp": {
            "type": "string",
            "format": "date-time",
            "title": "Timestamp"
          },
          "cpu_percent": {
            "type": "integer",
            "maximum": 100.0,
            "minimum": 0.0,
            "title": "Cpu Percent"
          },
          "memory_percent": {
            "type": "integer",
            "maximum": 100.0,
            "minimum": 0.0,
            "title": "Memory Percent"
          },
          "temperature_c": {
            "type": "integer",
            "maximum": 150.0,
            "minimum": -50.0,
            "title": "Temperature C"
          },
          "memory_used_gb": {
            "type": "number",
            "minimum": 0.0,
            "title": "Memory Used Gb"
          },
          "origin": {
            "type": "string",
            "enum": [
              "synthetic",
              "real"
            ],
            "title": "Origin",
            "default": "synthetic"
          }
        },
        "type": "object",
        "required": [
          "timestamp",
          "cpu_percent",
          "memory_percent",
          "temperature_c",
          "memory_used_gb"
        ],
        "title": "CPUMetric",
        "description": "CPU utilization and memory metrics."
      },
      "ErrorResponse": {
        "properties": {
          "status": {
            "type": "integer",
            "maximum": 599.0,
            "minimum": 400.0,
            "title": "Status"
          },
          "title": {
            "type": "string",
            "title": "Title"
          },
          "detail": {
            "type": "string",
            "title": "Detail"
          },
          "instance": {
            "type": "string",
            "title": "Instance"
          },
          "error_code": {
            "type": "string",
            "title": "Error Code"
          }
        },
        "type": "object",
        "required": [
          "status",
          "title",
          "detail",
          "instance",
          "error_code"
        ],
        "title": "ErrorResponse",
        "description": "RFC7807-style error body with a stable machine-readable code."
      },
      "GPUInfo": {
        "properties": {
          "name": {
            "type": "string",
            "title": "Name"
          },
          "memory_gb": {
            "type": "integer",
            "title": "Memory Gb"
          }
        },
        "type": "object",
        "required": [
          "name",
          "memory_gb"
        ],
        "title": "GPUInfo",
        "description": "Information about a single GPU on a node."
      },
      "GPUMetric": {
        "properties": {
          "timestamp": {
            "type": "string",
            "format": "date-time",
            "title": "Timestamp"
