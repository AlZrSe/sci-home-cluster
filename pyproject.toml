[project]
name = "scientific-home-cluster"
version = "0.1.0"
description = "Scientific Home Cluster Platform"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Scientific Home Cluster Team"}
]

# Dependencies
dependencies = [
    "fastapi==0.100.0",
    "uvicorn[standard]==0.25.0",
    "sqlalchemy>=2.0.37,<2.1",
    "alembic==1.13.1",
    "aiosqlite==0.19.0",
    "pyyaml==5.3.1",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings==2.0.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "psutil==5.9.0",
    "gputil==1.4.0",
    "portalocker==2.0.0",
    "typer[rich]==0.9.0",
    "rich==13.0.0",
    "watchdog==4.0.0",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.0",
    "httpx==0.27.0",
    "ruff==0.5.0",
    "mypy==1.0.0",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.0",
    "pytest-xdist==3.5.0",
    "pytest-watch==4.2.0",
    "types-passlib==1.7.7.20240106",
    "types-python-jose==3.3.0.20240106",
]

[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "C90"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Resolved relative to the current working directory, so this only works
# when mypy is invoked from the repo root (mypy does not walk up to find
# its config). `mypy .` from the root is the supported invocation.
mypy_path = "stubs"
ignore_missing_imports = true
exclude = ["^(test_venv|test_venv2|venv_test|venv|node_modules|frontend)/"]

# These modules are not yet typed to the project's standard. Each entry
# is deliberately narrow - do not widen these patterns, fix the module.
[[tool.mypy-overrides]]
module = "backend.services.syncthing_service"
ignore_errors = true

[[tool.mypy-overrides]]
module = "backend.core.deps"
ignore_errors = true

[[tool.mypy-overrides]]
module = "backend.api.v1.jobs"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "slow: mark test as slow running",
    "websocket: mark test as requiring WebSocket support",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "shared*", "agent*", "cli*"]
exclude = ["test*", "docs*", "docker*", "frontend*", "stubs*", "node_modules*"]

[project.scripts]
sci-run = "cli.command:main"
run-agent = "agent.run_agent:main"