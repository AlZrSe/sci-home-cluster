[project]
name = "scientific-home-cluster"
version = "1.0.0"
description = "Scientific Home Cluster Platform"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Scientific Home Cluster Team"}
]

# Dependencies
dependencies = [
    "fastapi>=0.100.0,<0.101.0",
    "uvicorn[standard]>=0.25.0,<0.26.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0.0,<2.1.0",
    "psutil>=5.9.0,<6.0.0",
    "gputil>=1.4.0,<2.0.0",
    "portalocker>=2.0.0,<3.0.0",
    "typer>=0.9.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    "watchdog>=4.0.0,<5.0.0",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "httpx>=0.27.0,<0.28.0",
    "ruff>=0.5.0,<0.6.0",
    "mypy>=1.0.0,<2.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "C90"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
