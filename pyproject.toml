[project]
name = "scientific-home-cluster"
version = "0.1.0"
description = "Scientific Home Cluster Platform"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Scientific Home Cluster Team"}
]

# Dependencies
dependencies = [
    "fastapi==0.100.0",
    "uvicorn[standard]==0.25.0",
    "sqlalchemy==2.0.0",
    "pyyaml==5.3.1",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings==2.0.0",
    "psutil==5.9.0",
    "gputil==1.4.0",
    "portalocker==2.0.0",
    "typer[rich]==0.9.0",
    "rich==13.0.0",
    "watchdog==4.0.0",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.0",
    "httpx==0.27.0",
    "ruff==0.5.0",
    "mypy==1.0.0",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.0",
    "pytest-xdist==3.5.0",
    "pytest-watch==4.2.0",
]

[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "C90"]
ignore = []

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
mypy_path = "stubs"
ignore_missing_imports = true

[[tool.mypy-overrides]]
module = "backend.store.*"
ignore_errors = true

[[tool.mypy-overrides]]
module = "backend.alembic.*"
ignore_errors = true

[[tool.mypy-overrides]]
module = "backend.services.syncthing_service"
ignore_errors = true

[[tool.mypy-overrides]]
module = "backend.core.deps"
ignore_errors = true

[[tool.mypy-overrides]]
module = "backend.api.v1.jobs"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "slow: mark test as slow running",
    "websocket: mark test as requiring WebSocket support",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools]
package-dir = {"" = "."}

[project.scripts]
sci-run = "cli.command:app"
run-agent = "agent.run_agent:main"
test = "pytest --cov=backend --cov-report=term-missing --cov-fail-under=80"
test-unit = "pytest backend/tests/unit -v"
test-integration = "pytest backend/tests/integration -v"
test-watch = "pytest-watch --runner 'pytest --cov=backend'"