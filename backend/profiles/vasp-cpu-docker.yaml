id: vasp-cpu-docker
name: VASP CPU (Docker)
software: vasp
description: CPU VASP run in the alzrse/vasp_gpu:6.3 Docker image.
command: "docker run -it --rm -v ${PWD}:/task alzrse/vasp_gpu:6.3 mpiexec -np 1 vasp_std"
working_dir: "."
gpus: 0
cpus: 1
memory_gb: 16
vram_gb: 0
input: ""
output: ""
max_retries: 0
retry_delay_seconds: 0
env: []
builtin: true