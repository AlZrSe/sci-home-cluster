id: vasp-gpu-docker
name: VASP GPU (Docker)
software: vasp
description: GPU VASP run in the alzrse/vasp_gpu:6.3 Docker image.
command: "docker run -it --rm -v ${PWD}:/task --gpus all --env NVIDIA_DISABLE_REQUIRE=1 alzrse/vasp_gpu:6.3 mpiexec -np 1 vasp_std"
working_dir: "."
gpus: 1
cpus: 4
memory_gb: 32
vram_gb: 16
input: ""
output: ""
max_retries: 0
retry_delay_seconds: 0
env: []
builtin: true