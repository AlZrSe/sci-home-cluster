# OpenTelemetry Collector configuration for the Scientific Home Cluster.
#
# Receives OTLP from the backend (and any other client) and forwards to
# Grafana Cloud. Secrets are supplied via environment variables; see .env.example.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Grafana Cloud OTLP gateway. Requires GRAFANA_OTLP_ENDPOINT and
  # GRAFANA_OTLP_AUTH (base64 of "instanceId:apiToken").
  otlphttp:
    endpoint: ${GRAFANA_OTLP_ENDPOINT}
    headers:
      authorization: "Basic ${GRAFANA_OTLP_AUTH}"
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp, debug]
  telemetry:
    logs:
      level: info
